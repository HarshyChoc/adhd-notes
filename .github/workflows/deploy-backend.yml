name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "scripts/deploy-backend-gcp.sh"
      - "scripts/deploy-scheduler-gcp.sh"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Run service
        run: ./scripts/deploy-backend-gcp.sh
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          INTERNAL_CRON_SERVICE_ACCOUNT_EMAIL: ${{ vars.INTERNAL_CRON_SERVICE_ACCOUNT_EMAIL }}

      - name: Deploy Cloud Scheduler job
        run: ./scripts/deploy-scheduler-gcp.sh
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          INTERNAL_CRON_SERVICE_ACCOUNT_EMAIL: ${{ vars.INTERNAL_CRON_SERVICE_ACCOUNT_EMAIL }}
